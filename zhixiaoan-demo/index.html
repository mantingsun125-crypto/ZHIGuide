  /* ===== Scrollable content ===== */
  .scroll-content {
    position: absolute;
    top: 88px; left: 0; right: 0; bottom: 0;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
  }
  .scroll-content::-webkit-scrollbar { display: none; }

  .scroll-content > * {
    position: relative;
    z-index: 1;
  }

  /* ===== Status Bar ===== */
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 20px 0;
    font-size: 15px;
    font-weight: 600;
    color: #000;
    height: 44px;
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 40;
  }
  .status-bar-right { display: flex; align-items: center; gap: 5px; }

  /* ===== Top Nav ===== */
  .top-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 12px;
    height: 44px;
    position: relative;
    position: absolute;
    top: 44px;
    left: 0;
    right: 0;
    z-index: 40;
  }
  .nav-left, .nav-right { display: flex; align-items: center; gap: 10px; }
  .nav-left { margin-left: 12px; }
  .nav-right { margin-right: 4px; gap: 6px; }
  .nav-icon {
    width: 34px; height: 34px;
    cursor: pointer;
    object-fit: contain;
  }
  /* Back icon asset has inner blank space, nudge visual glyph left for pixel alignment */
  .nav-back-icon {
    transform: translateX(-8px);
  }
  .top-agent-mini {
    position: absolute;
    left: 44px;
    right: 170px;
    top: 50%;
    transform: translateY(-50%) translateY(-6px);
    display: flex;
    align-items: center;
    gap: 7px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  .mini-avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    object-fit: cover;
    object-position: center top;
    flex-shrink: 0;
  }
  .mini-name {
    font-size: 18px;
    font-weight: 700;
    color: #1a1a1a;
    line-height: 1;
    white-space: nowrap;
  }
  .mini-badge {
    font-size: 11px;
    font-weight: 600;
    color: #fff3d5;
    background: rgba(30, 30, 30, 0.66);
    padding: 5px 8px;
    border-radius: 7px;
    line-height: 1;
    white-space: nowrap;
    transform: scale(0.95);
    transform-origin: left center;
  }

  /* ===== Header ===== */
  .header {
    padding: 10px 20px 4px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    transition: opacity 0.5s ease, transform 0.5s ease, max-height 0.5s ease, margin 0.5s ease, padding 0.5s ease;
    max-height: 120px;
    opacity: 1;
    transform: translateY(0);
  }
  .header-text { flex: 1; padding-right: 12px; }
  .greeting {
    font-size: 20px;
    font-weight: 600;
    color: #1a1a1a;
    line-height: 1.3;
    white-space: nowrap;
  }
  .greeting .highlight, .sub-greeting .highlight { color: #e8630e; }
  .sub-greeting {
    font-size: 12px;
    color: #555;
    margin-top: 6px;
    white-space: nowrap;
  }
  .avatar-container {
    width: 80px;
    height: 80px;
    flex-shrink: 0;
  }
  .avatar-img {
    width: 80px;
    height: 80px;
    object-fit: contain;
  }
  .phone-frame.compact-mode .header {
    opacity: 0;
    transform: translateY(-10px);
    max-height: 0;
    margin: 0;
    padding-top: 0;
    padding-bottom: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .phone-frame.compact-mode .top-agent-mini {
    opacity: 1;
    transform: translateY(-50%) translateY(0);
  }

  /* ===== Card ===== */
  .card {
    margin: 0 16px;
    background: #fff;
    border-radius: 16px;
    padding: 20px;
    position: relative;
    overflow: hidden;
  }
  .card-vip {
    position: absolute;
    top: 14px;
    right: 80px;
    width: 98px;
    opacity: 0.06;
    pointer-events: none;
  }
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .card-title {
    font-size: 17px;
    font-weight: 700;
    color: #1a1a1a;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card-title-bar {
    width: 4px;
    height: 20px;
    background: #e8630e;
    border-radius: 2px;
  }
  .refresh-btn {
    font-size: 13px;
    color: #999;
    display: flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    user-select: none;
  }
  .refresh-btn img { width: 16px; height: 16px; }

  /* ===== Suggestion Items ===== */
  .suggestion-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    height: 48px;
    background: #f7f6f4;
    border-radius: 12px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .suggestion-item:last-child { margin-bottom: 0; }
  .suggestion-item:active { background: #f0ece6; }
  .suggestion-left {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
    overflow: hidden;
  }
  .hash-icon { width: 16px; height: 16px; flex-shrink: 0; }
  .suggestion-text { font-size: 14px; color: #333; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .suggestion-arrow { width: 16px; height: 16px; flex-shrink: 0; }

  /* ===== Chat Area ===== */
  .chat-area { padding: 0 16px; }
  .chat-msg {
    display: flex;
    margin: 12px 0;
    animation: msgFadeIn 0.3s ease;
  }
  @keyframes msgFadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .chat-msg.left { justify-content: flex-start; }
  .chat-msg.center { justify-content: center; }
  .chat-msg.right { justify-content: flex-end; }
  .chat-bubble-left {
    background: #fff;
    border-radius: 2px 16px 16px 16px;
    padding: 10px 14px;
    font-size: 14px;
    color: #333;
    line-height: 1.5;
    letter-spacing: -0.1px;
    max-width: 85%;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
  }
  .chat-bubble-left .link { color: #e8630e; font-weight: 500; }
  .chat-bubble-left em { font-style: normal; color: #e8630e; font-weight: 600; }
  .chat-bubble-right {
    background: linear-gradient(135deg, #ff8c3a, #e8630e);
    border-radius: 16px 2px 16px 16px;
    padding: 10px 14px;
    font-size: 14px;
    color: #fff;
    line-height: 1.5;
    letter-spacing: -0.1px;
    max-width: 75%;
    box-shadow: 0 2px 8px rgba(232,99,14,0.25);
  }

  /* Thinking dots */
  .thinking-dots {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 18px 22px;
    min-width: 80px;
  }
  .thinking-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #e8630e;
    animation: dotBounce 1.4s ease-in-out infinite;
  }
  .thinking-dot:nth-child(1) { animation-delay: 0s; }
  .thinking-dot:nth-child(2) { animation-delay: 0.2s; width: 8px; height: 8px; }
  .thinking-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes dotBounce {
    0%, 80%, 100% { transform: scale(0.5); opacity: 0.35; }
    40% { transform: scale(1); opacity: 1; }
  }

  /* ===== Scenario Card ===== */
  .scenario-card {
    background: #f5f3f0;
    border-radius: 16px;
    padding: 20px;
    width: calc(375px - 32px);
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
  }
  .scenario-card .card-desc {
    font-size: 15px;
    color: #1a1a1a;
    line-height: 1.4;
    margin-bottom: 14px;
    white-space: nowrap;
  }

  .compare-sheet-sub {
    font-size: 12px;
    color: #8f8f98;
    text-align: center;
    margin: 2px 0 12px;
  }
  .compare-sheet-close {
    position: absolute;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 26px;
    height: 26px;
    border: none;
    background: transparent;
    font-size: 36px;
    line-height: 1;
    color: #333;
    cursor: pointer;
  }
  .compare-sheet-tabs {
    display: flex;
    justify-content: space-between;
    gap: 0;
    width: 100%;
    flex-wrap: nowrap;
    white-space: nowrap;
  }
  .compare-sheet-tab {
    font-size: 15px;
    color: #85858e;
    font-weight: 500;
    position: relative;
    flex: 1;
    text-align: center;
    min-width: 0;
  }
  .compare-sheet-tab.active {
    color: #2a2a2d;
    font-weight: 700;
  }
  .compare-sheet-tab.active::after {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    bottom: -9px;
    height: 3px;
    border-radius: 2px;
    background: #f1872a;
  }
  .compare-sheet-body {
    padding: 10px 12px 16px;
  }
  .sheet-product {
    background: #fff;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    position: relative;
  }
  .sheet-product-tag {
    position: absolute;
    top: 8px;
    right: 12px;
    font-size: 10px;
    color: #999;
    border: 1px solid #ddd;
    border-radius: 4px;
    padding: 2px 6px;
    line-height: 1.3;
  }
  .sheet-product.selected {
    background: #fff3e8;
  }
  .sheet-product-main {
    min-width: 0;
    flex: 1;
    padding-right: 12px;
  }
  .sheet-product-name {
    font-size: 18px;
    font-weight: 700;
    color: #2f2f2f;
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .sheet-product-desc {
    font-size: 12px;
    color: #8f8f98;
    margin-bottom: 4px;
  }
  .sheet-product-price {
    font-size: 12px;
    color: #f1872a;
    font-weight: 700;
  }
  .sheet-product-price .num {
    font-size: 14px;
    line-height: 1;
  }
  .sheet-product-check {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 2px solid #d9d9df;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    color: #fff;
    flex-shrink: 0;
    background: #fff;
  }
  .sheet-product.selected .sheet-product-check {
    border-color: #f1872a;
    background: #f1872a;
  }
  .sheet-product.selected .sheet-product-check::after {
    content: '✓';
  }
  .compare-sheet-foot {
    position: sticky;
    bottom: 0;
    background: #f4f4f6;
    padding: 8px 10px 14px;
  }
  .compare-sheet-confirm {
    width: 100%;
    height: 46px;
    border: none;
    border-radius: 23px;
    background: #f6b88b;
    color: #fff;
    font-size: 17px;
    font-weight: 700;
    cursor: not-allowed;
  }
  .compare-sheet-confirm.active {
    background: #ff7a00;
    cursor: pointer;
  }
</style>
</head>

<script>
  function openVideoDetail() {
    document.getElementById('videoDetailOverlay').classList.add('active');
  }
  function closeVideoDetail() {
    document.getElementById('videoDetailOverlay').classList.remove('active');
  }

  function handleRefresh() {
    const suggestions = [
      ['帮我详细解读医无忧·少儿百万医', '帮我配置完整的保障方案', '医无忧·少儿百万医的价格折扣有...'],
      ['重疾险和百万医疗的区别是什么', '给孩子买保险怎么选', '医无忧全民版的理赔流程'],
      ['百万医疗险怎么选最划算', '家庭保障方案怎么配置', '少儿百万医的投保规则有哪些']
    ];
    const current = document.querySelectorAll('.suggestion-text');
    const randomSet = suggestions[Math.floor(Math.random() * suggestions.length)];
    current.forEach((el, i) => {
      el.style.transition = 'opacity 0.2s';
      el.style.opacity = '0';
      setTimeout(() => {
        el.textContent = randomSet[i];
        el.style.opacity = '1';
      }, 200);
    });
  }

  function handleSuggestion(el) {
    const text = el.querySelector('.suggestion-text').textContent;
    sendMessage(text);
  }

  function handleTool(name) {
    const sheet = document.getElementById('serviceSheet');
    if (sheet && sheet.classList.contains('active')) {
      closeSheet();
    }
    sendMessage(name);
  }

  function isProductCompareIntent(text) {
    if (!text) return false;
    const normalized = text.trim();
    return normalized === '产品对比' || normalized === '帮我对比热门产品';
  }

  function isProductInterpretIntent(text) {
    if (!text) return false;
    const t = text.trim();
    return t === '产品解读' || t === '帮我解读热门产品';
  }

  function isRenewalIntent(text) {
    if (!text) return false;
    const t = text.trim();
    return t === '续保管理' || t === '续保';
  }

  function isPetInsuranceIntent(text) {
    if (!text) return false;
    const t = text.trim();
    return (t.includes('猫') || t.includes('狗') || t.includes('宠物')) && (t.includes('保险') || t.includes('推荐'));
  }

  function isProductInterpretDetailIntent(text) {
    if (!text) return false;
    const t = text.trim();
    return t.startsWith('解读') && t.length > 2;
  }

  // Store original toolbar HTML for restoration
  let originalToolbarHTML = '';

  function enterInterpretScene() {
    const toolbar = document.querySelector('.toolbar');
    if (!originalToolbarHTML) originalToolbarHTML = toolbar.innerHTML;
    toolbar.innerHTML = `
      <button class="tool-btn" onclick="handleTool('保障内容')">保障内容</button>
      <button class="tool-btn" onclick="handleTool('投保规则')">投保规则</button>
      <button class="tool-btn" onclick="handleTool('特色服务')">特色服务</button>
      <button class="tool-btn" onclick="handleTool('理赔亮点')">理赔亮点</button>
      <button class="tool-btn" onclick="exitInterpretScene()">退出解读</button>
    `;
  }

  function exitInterpretScene() {
    const toolbar = document.querySelector('.toolbar');
    if (originalToolbarHTML) {
      toolbar.innerHTML = originalToolbarHTML;
      originalToolbarHTML = '';
    }
    initToolbarDrag();
  }

  // Toolbar drag-to-scroll (desktop mouse support)
  (function() {
    const tb = document.querySelector('.toolbar');
    let isDown = false, startX, scrollLeft, dragged = false;
    tb.addEventListener('mousedown', e => {
      isDown = true; dragged = false;
      tb.style.cursor = 'grabbing';
      startX = e.pageX - tb.offsetLeft;
      scrollLeft = tb.scrollLeft;
    });
    tb.addEventListener('mouseleave', () => { isDown = false; tb.style.cursor = ''; });
    tb.addEventListener('mouseup', () => { isDown = false; tb.style.cursor = ''; });
    tb.addEventListener('mousemove', e => {
      if (!isDown) return;
      const x = e.pageX - tb.offsetLeft;
      if (Math.abs(x - startX) > 5) dragged = true;
      if (!dragged) return;
      e.preventDefault();
      tb.scrollLeft = scrollLeft - (x - startX);
    });
    tb.addEventListener('click', e => {
      if (dragged) { e.stopPropagation(); e.preventDefault(); }
    }, true);
  })();

      const lastBubble = bubbles[bubbles.length - 1];

      // Calculate position relative to scroll container

      const center = scroll.scrollTop + 90; // center of visible area
      const allItems = scroll.querySelectorAll('.hf-wheel-item');
      let closest = 0, minDist = Infinity;
      allItems.forEach((el, i) => {
        const itemCenter = el.offsetTop - scroll.querySelector('.hf-wheel-spacer').offsetHeight + itemH / 2 + 68;
        const dist = Math.abs(center - itemCenter);
        if (dist < minDist) { minDist = dist; closest = i; }
        el.classList.remove('active');
      });
      if (allItems[closest]) {
        allItems[closest].classList.add('active');
        hfWheelSelected[field] = allItems[closest].dataset.value;
      }
    }

    scroll.addEventListener('scroll', updateActive, { passive: true });
    // Click to select

  /* ===== 千人千品映射引擎 ===== */
  function computeRecommendation() {
    const age = parseInt(healthFormData.age) || 26;
    const income = healthFormData.income;
    const city = healthFormData.city;
    const diseases = healthFormData.disease;
    const hasDisease = diseases.length > 0;

    const severeList = ['肿瘤','冠心病','心脏病'];
    const hasSevere = diseases.some(d => severeList.includes(d));
    const hasMild = hasDisease && !hasSevere;

    const tier1 = ['北京','上海','广州','深圳','成都','杭州','重庆','武汉','苏州','西安','南京','东莞','天津','郑州','长沙','佛山','宁波','青岛','沈阳','昆明','合肥'];
    const isTier1 = tier1.includes(city);

    const incomeLevel = (() => {
      if (income === '无收入' || income === '6万以内' || income === '当地平均收入') return 'low';
      if (income === '6-10万' || income === '10-15万') return 'mid';
      if (income === '15-30万') return 'midHigh';
      return 'high';
    })();

    const ageGroup = age < 18 ? 'child' : age <= 30 ? 'young' : age <= 55 ? 'mid' : age <= 88 ? 'senior' : 'elder';

    // ---- 映射责任 ----
    let selected = new Set();

    // 默认兜底
    selected.add('救护车费用');
    selected.add('自费门急诊医疗');

    // 维度一：疾病（权重最高）
    if (hasSevere) {
      selected.add('重大疾病保险金');
      selected.add('医院外购药品费用');
      selected.add('恶性肿瘤特定用药基因检测费用');
    } else if (hasMild) {
      selected.add('重大疾病保险金');
    }

    // 维度二：年龄
    if (ageGroup === 'child') {
      selected.add('意外和疾病门急诊');
    } else if (ageGroup === 'mid' && !hasSevere) {
      selected.add('重大疾病保险金');
    } else if (ageGroup === 'senior') {
      selected.add('救护车费用');
      selected.add('意外和疾病门急诊');
      selected.add('特定疾病异地转诊公共交通费用');
    }

    // 维度三：收入 → 控制数量上限
    const maxByIncome = incomeLevel === 'low' ? 3 : incomeLevel === 'mid' ? 5 : incomeLevel === 'midHigh' ? 7 : 9;

    // 维度四：城市
    if (isTier1) {
      selected.add('扩展特需医疗费用');
    } else {
      selected.add('特定疾病异地转诊公共交通费用');
    }

    // 按优先级补充到收入上限
    const priorityPool = [
      '医院外购药品费用','重大疾病保险金','意外和疾病门急诊',
      '恶性肿瘤特定用药基因检测费用','扩展特需医疗费用',
      '特定疾病异地转诊公共交通费用','自费门急诊医疗','救护车费用'
    ];
    for (const item of priorityPool) {
      if (selected.size >= maxByIncome) break;
      selected.add(item);
    }

    // 按固定顺序输出，截断到上限
    const allItems = [
      '重大疾病保险金','医院外购药品费用','恶性肿瘤特定用药基因检测费用',
      '扩展特需医疗费用','特定疾病异地转诊公共交通费用',
      '意外和疾病门急诊','自费门急诊医疗','救护车费用'
    ];
    let finalItems = allItems.filter(i => selected.has(i));
    if (finalItems.length > maxByIncome) finalItems = finalItems.slice(0, maxByIncome);

    // ---- 计算评分 ----
    const count = finalItems.length;
    const responsibilityScore = count <= 2 ? 4.5 : count <= 5 ? 6.5 : count <= 8 ? 8.5 : 10;

    const costEfficiency = (() => {
      if (incomeLevel === 'low') return count <= 3 ? 9.8 : 7.5;
      if (incomeLevel === 'mid') return count <= 5 ? 8.5 : 7.0;
      if (incomeLevel === 'midHigh') return count <= 7 ? 7.5 : 6.5;
      return count <= 7 ? 6.5 : 5.5;
    })();

    const experienceScore = 9.5;
    const serviceScore = 9.5;
    const claimScore = 9.5;
    const totalScore = (responsibilityScore * 0.3 + costEfficiency * 0.25 + experienceScore * 0.15 + serviceScore * 0.15 + claimScore * 0.15).toFixed(1);

    return {
      items: finalItems, count, hasDisease, hasSevere, hasMild,
      ageGroup, incomeLevel, isTier1,
      scores: { responsibility: responsibilityScore, costEfficiency, experience: experienceScore, service: serviceScore, total: totalScore }
    };
  }

    if (!healthFormData.relation) { openHfPicker('relation'); return; }

    if (healthFormData.disease.length === 0 && !healthFormData._noDisease) { openHfPicker('disease'); return; }

    const chatArea = document.getElementById('chatArea');

    // 1. User auto-sends their selected info

    const diseaseText = healthFormData._noDisease ? '无疾病' : healthFormData.disease.join('、');

    const userMsg = document.createElement('div');

    thinkingMsg.innerHTML = '<div class="chat-bubble-left thinking-dots"><span class="thinking-dot"></span><span class="thinking-dot"></span><span class="thinking-dot"></span></div>';
    chatArea.appendChild(thinkingMsg);
    scrollToLastUserMsg();

    // 3. After 1-1.2s, show result card
    const delay = 1000 + Math.floor(Math.random() * 200);
    setTimeout(() => {
      thinkingMsg.remove();

      const resultMsg = document.createElement('div');
      resultMsg.className = 'chat-msg center';
      resultMsg.innerHTML = buildResultCard(rec);
      chatArea.appendChild(resultMsg);
      scrollToLastUserMsg();

      setTimeout(() => drawRadar(rec), 100);

      setTimeout(() => {
        const followups = rec.hasDisease
          ? ['0免赔百万医保什么', '既往症赔不赔', '保障责任怎么选']
          : ['0免赔百万医保什么', '免赔额怎么算', '保障责任怎么选'];
        chatArea.appendChild(createFollowup(followups));
        scrollToLastUserMsg();
      }, 400);
    }, delay);
  }

  function buildResultCard(rec) {

      '扩展特需医疗费用':'特需医疗', '特定疾病异地转诊公共交通费用':'异地转诊'
    };
    const itemsShort = rec.items.map(i => shortName[i] || i);

    // 方案亮点文案

    } else if (rec.hasSevere) {

    } else {
      highlightText = `${pronoun}虽有${healthFormData.disease.join('、')}等既往病史，但<em>仍可投保</em>！已配置${itemsShort.join('、')}等<em>${rec.count}项保障责任</em>，涵盖住院+手术+特药保障，<em>0免赔、最高赔付100%</em>，综合评分<em>${rec.scores.total}分</em>。`;
    }

    const productName = '0免赔·百万医（自选版）';
    const productDesc = `已选${rec.count}项保障责任，${rec.isTier1 ? '含特需医疗' : '含异地转诊'}`;
    const priceMap = { 2:'8.5', 3:'15', 4:'22', 5:'35', 6:'48', 7:'62', 8:'78', 9:'95' };
    const price = priceMap[rec.count] || '35';
    const tags = itemsShort.slice(0, 3);

    return `<div class="rec-result-card">
      <div class="rec-header">
        <div class="rec-header-left">
          <div class="rec-badge">定制保障</div>
          <div class="rec-title">您的健康险定制方案</div>
        </div>
        <div class="rec-check">✓</div>
      </div>
      <div class="rec-radar-section">
        <canvas id="radarCanvas" width="480" height="480" style="width:240px;height:240px;display:block;margin:0 auto;"></canvas>
      </div>
      <div class="rec-highlight-section">
        <div class="rec-highlight-label">方案亮点总结</div>
        <div class="rec-highlight-text">${highlightText}</div>
      </div>
      <div class="rec-divider"></div>
      <div class="rec-product">
        <div class="rec-prod-top">
          <div class="rec-prod-rank">智能推荐<br><span class="rec-prod-rank-sub">${rec.scores.total}分</span></div>
          <div class="rec-prod-name">${escapeHtml(productName)}</div>
        </div>
        <div class="rec-prod-desc">${escapeHtml(productDesc)}</div>
        <div class="rec-prod-specs">
          <div class="rec-prod-spec"><strong>28天-65周岁</strong>承保年龄</div>
          <div class="rec-prod-spec"><strong>600万元</strong>最高保额</div>
          <div class="rec-prod-spec"><strong>1年</strong>保障期限</div>
        </div>
        <div class="rec-prod-tags">${tags.map(t => `<span class="rec-prod-tag-item">${t}</span>`).join('')}</div>
        <div class="rec-prod-bottom">
          <div class="rec-prod-price"><span class="price">${price}</span><span class="unit">元/月起</span></div>
          <button class="rec-prod-btn">解读</button>
        </div>
      </div>
    </div>`;
  }

  function drawRadar(rec) {
    const canvas = document.getElementById('radarCanvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const w = 480, h = 480, cx = w/2, cy = h/2, r = 120;
    canvas.width = w; canvas.height = h;

    const s = rec.scores;
    const claimScore = 9.5; // 理赔评分固定
    const labels = ['保障责任','产品价格','投保体验','服务权益','理赔评分'];
    const scores = [s.responsibility, s.costEfficiency, s.experience, s.service, claimScore];
    const targetValues = scores.map(v => v / 10);
    const totalScore = s.total;
    const n = labels.length;

    function drawFrame(progress) {
      ctx.clearRect(0, 0, w, h);
      const values = targetValues.map(v => v * progress);

      // Grid
      ctx.strokeStyle = '#f0ece6';
      ctx.lineWidth = 0.8;
      for (let ring = 1; ring <= 5; ring++) {
        ctx.beginPath();
        const rr = r * ring / 5;
        for (let i = 0; i <= n; i++) {
          const angle = (Math.PI * 2 / n) * i - Math.PI / 2;
          const x = cx + rr * Math.cos(angle);
          const y = cy + rr * Math.sin(angle);
          i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        }
        ctx.stroke();
      }

      // Axis
      for (let i = 0; i < n; i++) {
        const angle = (Math.PI * 2 / n) * i - Math.PI / 2;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + r * Math.cos(angle), cy + r * Math.sin(angle));
        ctx.strokeStyle = '#f0ece6';
        ctx.stroke();
      }

      // Data polygon
      ctx.beginPath();
      for (let i = 0; i <= n; i++) {
        const idx = i % n;
        const angle = (Math.PI * 2 / n) * idx - Math.PI / 2;
        const x = cx + r * values[idx] * Math.cos(angle);
        const y = cy + r * values[idx] * Math.sin(angle);
        i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.fillStyle = 'rgba(232, 99, 14, 0.12)';
      ctx.fill();
      ctx.strokeStyle = '#e8630e';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Dots
      for (let i = 0; i < n; i++) {
        const angle = (Math.PI * 2 / n) * i - Math.PI / 2;
        const x = cx + r * values[i] * Math.cos(angle);
        const y = cy + r * values[i] * Math.sin(angle);
        ctx.beginPath();
        ctx.arc(x, y, 4, 0, Math.PI * 2);
        ctx.fillStyle = '#e8630e';
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      // Labels + scores (always full, not animated)
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (let i = 0; i < n; i++) {
        const angle = (Math.PI * 2 / n) * i - Math.PI / 2;
        const lx = cx + (r + 42) * Math.cos(angle);
        const ly = cy + (r + 42) * Math.sin(angle);
        ctx.fillStyle = '#666';
        ctx.font = '13px PingFang SC, sans-serif';
        ctx.fillText(labels[i], lx, ly - 10);
        ctx.fillStyle = '#e8630e';
        ctx.font = 'bold 15px PingFang SC, sans-serif';
        ctx.fillText(scores[i] + '分', lx, ly + 10);
      }

      // Center score
      ctx.fillStyle = '#e8630e';
      ctx.font = 'bold 22px PingFang SC, sans-serif';
      ctx.fillText(totalScore + '分', cx, cy);
    }

    // Animate: expand from center over 600ms
    const duration = 600;
    const startTime = performance.now();
    function animate(now) {
      let t = Math.min((now - startTime) / duration, 1);
      // easeOutCubic
      t = 1 - Math.pow(1 - t, 3);
      drawFrame(t);
      if (t < 1) requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);
  }

  // 从产品页跳转过来：隐藏首页内容，展示人工/AI选择

  function handleServiceChoice(type) {

        // 在AI回答后面展示猜你想问（克隆顶部卡片插入到聊天区）

          if (origCard) {

            cloned.removeAttribute('id');
            cloned.style.display = '';
            chatArea.appendChild(cloned);
          }
          scrollToLastUserMsg();
        }, 300);
      }, 800);
    }
  }
